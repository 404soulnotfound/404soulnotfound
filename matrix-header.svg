<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      .matrix-char {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 14px;
        fill: #7ab648;
      }
      .matrix-char-bright {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 14px;
        fill: #f2ead8;
      }
      .name-text {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 42px;
        font-weight: bold;
        fill: #f2ead8;
        filter: url(#neon-glow);
      }
      .sub-text {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 15px;
        fill: #7ab648;
        filter: url(#green-glow);
      }
    </style>
    <filter id="neon-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="green-glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="900" height="200" fill="#0a0b09"/>

  <!-- Matrix columns — each animates independently -->
  <!-- col 1 -->
  <g>
    <text class="matrix-char" x="10" y="0" opacity="0">1<animate attributeName="y" values="-20;220" dur="2.1s" repeatCount="indefinite" begin="0s"/><animate attributeName="opacity" values="0;1;1;0" dur="2.1s" repeatCount="indefinite" begin="0s"/></text>
    <text class="matrix-char" x="10" y="0" opacity="0">0<animate attributeName="y" values="-20;220" dur="2.1s" repeatCount="indefinite" begin="0.15s"/><animate attributeName="opacity" values="0;0.7;0.7;0" dur="2.1s" repeatCount="indefinite" begin="0.15s"/></text>
    <text class="matrix-char-bright" x="10" y="0" opacity="0">ソ<animate attributeName="y" values="-20;220" dur="2.1s" repeatCount="indefinite" begin="0.3s"/><animate attributeName="opacity" values="0;1;0.5;0" dur="2.1s" repeatCount="indefinite" begin="0.3s"/></text>
  </g>
  <!-- col 2 -->
  <g>
    <text class="matrix-char" x="30" y="0" opacity="0">ア<animate attributeName="y" values="-20;220" dur="1.8s" repeatCount="indefinite" begin="0.4s"/><animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite" begin="0.4s"/></text>
    <text class="matrix-char" x="30" y="0" opacity="0">1<animate attributeName="y" values="-20;220" dur="1.8s" repeatCount="indefinite" begin="0.6s"/><animate attributeName="opacity" values="0;0.6;0.6;0" dur="1.8s" repeatCount="indefinite" begin="0.6s"/></text>
    <text class="matrix-char-bright" x="30" y="0" opacity="0">イ<animate attributeName="y" values="-20;220" dur="1.8s" repeatCount="indefinite" begin="0.8s"/><animate attributeName="opacity" values="0;1;0.4;0" dur="1.8s" repeatCount="indefinite" begin="0.8s"/></text>
  </g>
  <!-- col 3 -->
  <g>
    <text class="matrix-char" x="50" y="0" opacity="0">0<animate attributeName="y" values="-20;220" dur="2.4s" repeatCount="indefinite" begin="0.2s"/><animate attributeName="opacity" values="0;0.8;0.8;0" dur="2.4s" repeatCount="indefinite" begin="0.2s"/></text>
    <text class="matrix-char-bright" x="50" y="0" opacity="0">ウ<animate attributeName="y" values="-20;220" dur="2.4s" repeatCount="indefinite" begin="0.5s"/><animate attributeName="opacity" values="0;1;0.5;0" dur="2.4s" repeatCount="indefinite" begin="0.5s"/></text>
    <text class="matrix-char" x="50" y="0" opacity="0">1<animate attributeName="y" values="-20;220" dur="2.4s" repeatCount="indefinite" begin="0.9s"/><animate attributeName="opacity" values="0;0.7;0.7;0" dur="2.4s" repeatCount="indefinite" begin="0.9s"/></text>
  </g>
  <!-- col 4 -->
  <g>
    <text class="matrix-char" x="70" y="0" opacity="0">エ<animate attributeName="y" values="-20;220" dur="1.6s" repeatCount="indefinite" begin="0.7s"/><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" repeatCount="indefinite" begin="0.7s"/></text>
    <text class="matrix-char" x="70" y="0" opacity="0">0<animate attributeName="y" values="-20;220" dur="1.6s" repeatCount="indefinite" begin="1.0s"/><animate attributeName="opacity" values="0;0.6;0.6;0" dur="1.6s" repeatCount="indefinite" begin="1.0s"/></text>
  </g>
  <!-- col 5 -->
  <g>
    <text class="matrix-char" x="820" y="0" opacity="0">オ<animate attributeName="y" values="-20;220" dur="2.2s" repeatCount="indefinite" begin="0.1s"/><animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" begin="0.1s"/></text>
    <text class="matrix-char" x="820" y="0" opacity="0">1<animate attributeName="y" values="-20;220" dur="2.2s" repeatCount="indefinite" begin="0.4s"/><animate attributeName="opacity" values="0;0.7;0.7;0" dur="2.2s" repeatCount="indefinite" begin="0.4s"/></text>
    <text class="matrix-char-bright" x="820" y="0" opacity="0">カ<animate attributeName="y" values="-20;220" dur="2.2s" repeatCount="indefinite" begin="0.7s"/><animate attributeName="opacity" values="0;1;0.4;0" dur="2.2s" repeatCount="indefinite" begin="0.7s"/></text>
  </g>
  <!-- col 6 -->
  <g>
    <text class="matrix-char" x="840" y="0" opacity="0">0<animate attributeName="y" values="-20;220" dur="1.9s" repeatCount="indefinite" begin="0.3s"/><animate attributeName="opacity" values="0;0.8;0.8;0" dur="1.9s" repeatCount="indefinite" begin="0.3s"/></text>
    <text class="matrix-char-bright" x="840" y="0" opacity="0">キ<animate attributeName="y" values="-20;220" dur="1.9s" repeatCount="indefinite" begin="0.6s"/><animate attributeName="opacity" values="0;1;0.5;0" dur="1.9s" repeatCount="indefinite" begin="0.6s"/></text>
  </g>
  <!-- col 7 -->
  <g>
    <text class="matrix-char" x="860" y="0" opacity="0">1<animate attributeName="y" values="-20;220" dur="2.0s" repeatCount="indefinite" begin="0.5s"/><animate attributeName="opacity" values="0;1;1;0" dur="2.0s" repeatCount="indefinite" begin="0.5s"/></text>
    <text class="matrix-char" x="860" y="0" opacity="0">ク<animate attributeName="y" values="-20;220" dur="2.0s" repeatCount="indefinite" begin="0.8s"/><animate attributeName="opacity" values="0;0.6;0.6;0" dur="2.0s" repeatCount="indefinite" begin="0.8s"/></text>
    <text class="matrix-char-bright" x="860" y="0" opacity="0">0<animate attributeName="y" values="-20;220" dur="2.0s" repeatCount="indefinite" begin="1.1s"/><animate attributeName="opacity" values="0;1;0.4;0" dur="2.0s" repeatCount="indefinite" begin="1.1s"/></text>
  </g>
  <!-- col 8 -->
  <g>
    <text class="matrix-char" x="880" y="0" opacity="0">ケ<animate attributeName="y" values="-20;220" dur="1.7s" repeatCount="indefinite" begin="0.2s"/><animate attributeName="opacity" values="0;1;1;0" dur="1.7s" repeatCount="indefinite" begin="0.2s"/></text>
    <text class="matrix-char" x="880" y="0" opacity="0">1<animate attributeName="y" values="-20;220" dur="1.7s" repeatCount="indefinite" begin="0.5s"/><animate attributeName="opacity" values="0;0.7;0.7;0" dur="1.7s" repeatCount="indefinite" begin="0.5s"/></text>
  </g>

  <!-- Dark overlay in center for text readability -->
  <rect x="90" y="20" width="720" height="160" rx="8" fill="rgba(10,11,9,0.75)"/>
  <rect x="90" y="20" width="720" height="160" rx="8" fill="none" stroke="#7ab648" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Neon glowing name -->
  <text class="name-text" x="450" y="105" text-anchor="middle">
    SOUMILI PAL
    <animate attributeName="opacity" values="1;0.85;1;0.9;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Green subtitle -->
  <text class="sub-text" x="450" y="140" text-anchor="middle">
    AI • ML • DATA • CURIOUS MIND
    <animate attributeName="opacity" values="0.7;1;0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- Corner brackets -->
  <line x1="92" y1="22" x2="112" y2="22" stroke="#7ab648" stroke-width="1.5" opacity="0.8"/>
  <line x1="92" y1="22" x2="92" y2="42" stroke="#7ab648" stroke-width="1.5" opacity="0.8"/>
  <line x1="806" y1="22" x2="786" y2="22" stroke="#7ab648" stroke-width="1.5" opacity="0.8"/>
  <line x1="806" y1="22" x2="806" y2="42" stroke="#7ab648" stroke-width="1.5" opacity="0.8"/>
  <line x1="92" y1="178" x2="112" y2="178" stroke="#7ab648" stroke-width="1.5" opacity="0.8"/>
  <line x1="92" y1="178" x2="92" y2="158" stroke="#7ab648" stroke-width="1.5" opacity="0.8"/>
  <line x1="806" y1="178" x2="786" y2="178" stroke="#7ab648" stroke-width="1.5" opacity="0.8"/>
  <line x1="806" y1="178" x2="806" y2="158" stroke="#7ab648" stroke-width="1.5" opacity="0.8"/>
</svg>
