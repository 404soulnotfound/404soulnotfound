<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .label { font-family: 'Courier New', monospace; font-size: 12px; fill: #f2ead8; }
      .pct { font-family: 'Courier New', monospace; font-size: 11px; fill: #7ab648; }
      .title { font-family: 'Courier New', monospace; font-size: 13px; fill: #7ab648; letter-spacing: 3px; }
    </style>
    <filter id="bar-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="280" fill="#0a0b09"/>

  <!-- Title -->
  <text class="title" x="450" y="28" text-anchor="middle">// SKILL MATRIX</text>
  <line x1="50" y1="38" x2="850" y2="38" stroke="#7ab648" stroke-width="0.4" stroke-opacity="0.3"/>

  <!-- Skill bars -->
  <!-- Python -->
  <text class="label" x="50" y="68">Python</text>
  <rect x="200" y="55" width="600" height="12" rx="2" fill="#1a2e10"/>
  <rect x="200" y="55" width="0" height="12" rx="2" fill="#7ab648" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="570" dur="1.5s" fill="freeze" begin="0.2s"/>
  </rect>
  <text class="pct" x="810" y="66">95%</text>

  <!-- Machine Learning -->
  <text class="label" x="50" y="98">Machine Learning</text>
  <rect x="200" y="85" width="600" height="12" rx="2" fill="#1a2e10"/>
  <rect x="200" y="85" width="0" height="12" rx="2" fill="#6aab4a" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="510" dur="1.5s" fill="freeze" begin="0.4s"/>
  </rect>
  <text class="pct" x="810" y="96">85%</text>

  <!-- Deep Learning -->
  <text class="label" x="50" y="128">Deep Learning</text>
  <rect x="200" y="115" width="600" height="12" rx="2" fill="#1a2e10"/>
  <rect x="200" y="115" width="0" height="12" rx="2" fill="#5a9a3a" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="480" dur="1.5s" fill="freeze" begin="0.6s"/>
  </rect>
  <text class="pct" x="810" y="126">80%</text>

  <!-- Computer Vision -->
  <text class="label" x="50" y="158">Computer Vision</text>
  <rect x="200" y="145" width="600" height="12" rx="2" fill="#1a2e10"/>
  <rect x="200" y="145" width="0" height="12" rx="2" fill="#7ab648" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="450" dur="1.5s" fill="freeze" begin="0.8s"/>
  </rect>
  <text class="pct" x="810" y="156">75%</text>

  <!-- NLP & RAG -->
  <text class="label" x="50" y="188">NLP &amp; RAG</text>
  <rect x="200" y="175" width="600" height="12" rx="2" fill="#1a2e10"/>
  <rect x="200" y="175" width="0" height="12" rx="2" fill="#6aab4a" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="420" dur="1.5s" fill="freeze" begin="1.0s"/>
  </rect>
  <text class="pct" x="810" y="186">70%</text>

  <!-- Problem Solving -->
  <text class="label" x="50" y="218">Problem Solving</text>
  <rect x="200" y="205" width="600" height="12" rx="2" fill="#1a2e10"/>
  <rect x="200" y="205" width="0" height="12" rx="2" fill="#5a9a3a" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="540" dur="1.5s" fill="freeze" begin="1.2s"/>
  </rect>
  <text class="pct" x="810" y="216">90%</text>

  <!-- Java -->
  <text class="label" x="50" y="248">Java</text>
  <rect x="200" y="235" width="600" height="12" rx="2" fill="#1a2e10"/>
  <rect x="200" y="235" width="0" height="12" rx="2" fill="#7ab648" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="390" dur="1.5s" fill="freeze" begin="1.4s"/>
  </rect>
  <text class="pct" x="810" y="246">65%</text>

  <!-- bottom line -->
  <line x1="50" y1="265" x2="850" y2="265" stroke="#7ab648" stroke-width="0.4" stroke-opacity="0.3"/>
  <text class="pct" x="50" y="278">404soulnotfound</text>
  <text class="pct" x="850" y="278" text-anchor="end">github.com</text>
</svg>
